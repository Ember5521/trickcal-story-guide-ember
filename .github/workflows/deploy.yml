name: Deploy Next.js site to Pages

on:
  # main 에 푸시할 때만 배포한다. 일상 작업은 develop 에서 한다.
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것은 취소하지 않는다 (프로덕션 배포라서).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 로컬 개발 환경과 같은 메이저로 맞춰 둔다. 여기만 올리면
          # 로컬에서 통과한 빌드가 CI 에서만 깨지는 일이 생긴다.
          node-version: "20"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # next.config.js 가 basePath 를 직접 고정하므로 자동 주입에 기대지 않는다.
          # 이 값은 이미지 최적화를 끄는 용도로만 남긴다.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      # 주입할 환경변수가 없다. Worker 주소는 src/lib/api.ts 의 기본값을 쓰고,
      # 데이터/이미지는 전부 그 Worker 뒤에 있다.
      - name: Build with Next.js
        run: npx --no-install next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
